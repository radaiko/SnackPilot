# SnackPilot spike host (task 2.2), following the gpui-mobile example's
# example/ios/project.yml at rev 0b882efdac7f524e0bb0b1d4c886b2aa752f9f20.
# Generate with: xcodegen generate   (run by ../bootstrap.sh)
name: SnackPilot
packages:
  Aptabase:
    url: https://github.com/aptabase/aptabase-swift.git
    from: "0.3.4"
options:
  bundleIdPrefix: dev.radaiko
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"

targets:
  SnackPilot:
    type: application
    platform: iOS
    sources:
      - path: Host/App.swift
        type: file
        buildPhase: sources
      - path: Host/Embedding.h
        type: file
        buildPhase: headers
      - path: Host/PlatformShims.h
        type: file
        buildPhase: headers
      - path: Shims
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - package: Aptabase
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: SnackPilot
        # Version numbers come from the build settings below, as the generated
        # plist did before it moved to this block.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Purpose strings carried over from src/ios/project.yml (v1 parity).
        NSLocationWhenInUseUsageDescription: "SnackPilot nutzt deinen Standort, um deinen Firmenstandort zu speichern."
        NSLocationAlwaysAndWhenInUseUsageDescription: "SnackPilot nutzt deinen Standort, um dich an Bestellungen zu erinnern, wenn du im Büro bist."
        # Region monitoring, and one background refresh for the reminder re-arm
        # and the new-menu check (notifications-location §10).
        UIBackgroundModes:
          - location
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.radaiko.gourmetclient.sync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.radaiko.gourmetclient
        PRODUCT_NAME: SnackPilot
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.2.1"
        CURRENT_PROJECT_VERSION: "43"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-emerald AppIcon-berry AppIcon-golden AppIcon-ocean"
        # Automatic signing, so `make ios-archive` is signed here instead of
        # needing an Organizer click: Xcode picks the team profile for a device
        # build and regenerates it at export when the certificate changed.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "555V4MNLK3"
        # Ad-hoc signing is simulator-only and is what fixes the keychain:
        # an unsigned binary gets SecItemAdd -34018 (errSecMissingEntitlement)
        # on the simulator; the ad-hoc signature alone is enough. No
        # entitlements file is used — Xcode's entitlements processor strips
        # the profile-gated keys (application-identifier,
        # keychain-access-groups) under ad-hoc signing with no team, so the
        # file would be dead weight (verified on the Mac: the generated
        # .xcent comes out an empty dict).
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        SWIFT_OBJC_BRIDGING_HEADER: "Host/PlatformShims.h"
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_BITCODE: NO
        # Statically link the Rust library: no debug-dylib executor, no dead-strip.
        ENABLE_DEBUG_DYLIB: NO
        OTHER_LINK_BINARY_WITH_LIBRARIES_SECTION_TYPE: static
        DEAD_CODE_STRIPPING: NO
        # Info.plist is generated from the `info:` block below: the background
        # modes and the BGTask identifier are arrays, which INFOPLIST_KEY_*
        # cannot express.
        # Link the Rust staticlib built by bootstrap.sh (cargo rustc --crate-type=staticlib).
        # Explicit .a path so the linker cannot pick up a dylib from the same directory.
        # The Release configuration links the optimised library
        # (`RUST_IOS_PROFILE=release` in bootstrap.sh); Debug keeps the fast
        # compile. A device test build should use Release for both.
        "APP_STATIC_LIB[sdk=iphonesimulator*][config=Debug]": "$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/debug/libsnackpilot_app.a"
        "APP_STATIC_LIB[sdk=iphoneos*][config=Debug]": "$(PROJECT_DIR)/../target/aarch64-apple-ios/debug/libsnackpilot_app.a"
        "APP_STATIC_LIB[sdk=iphonesimulator*][config=Release]": "$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/release/libsnackpilot_app.a"
        "APP_STATIC_LIB[sdk=iphoneos*][config=Release]": "$(PROJECT_DIR)/../target/aarch64-apple-ios/release/libsnackpilot_app.a"
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(APP_STATIC_LIB)"
          - "-lc++"
          - "-framework UIKit"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework QuartzCore"
          - "-framework CoreGraphics"
          - "-framework CoreText"
          - "-framework CoreFoundation"
          - "-framework Foundation"
          - "-framework Security"
          - "-framework SystemConfiguration"
          - "-framework AudioToolbox"
          - "-framework WebKit"
          - "-framework CoreMedia"
          - "-framework AVFoundation"
          - "-framework LocalAuthentication"
          - "-framework Contacts"
          - "-framework EventKit"
          - "-framework StoreKit"
          - "-framework CoreMotion"
          - "-ObjC"
        VALID_ARCHS: "arm64"
        ARCHS: "arm64"
        ONLY_ACTIVE_ARCH: YES
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: "0"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"

  SnackPilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/SpikeTapTests.swift
      - path: UITests/NotificationPermissionTests.swift
      - path: UITests/DialogOcclusionTests.swift
      - path: UITests/LoginTypingTests.swift
      - path: UITests/DesktopRegressionTests.swift
    dependencies:
      - target: SnackPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.radaiko.gourmetclient.uitests
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        VALID_ARCHS: "arm64"
        ARCHS: "arm64"
        ONLY_ACTIVE_ARCH: YES

schemes:
  SnackPilot:
    build:
      targets:
        SnackPilot: all
    test:
      targets:
        - SnackPilotUITests
