[package]
name = "snackpilot-app"
version = "0.0.0"
edition = "2021"

# cdylib: Android loads libsnackpilot_app.so from the Gradle host (task 2.1).
# lib: host-side unit tests and the later desktop bin (task 2.3).
[lib]
crate-type = ["cdylib", "lib"]

# Desktop spike (task 2.3). No required-features: cargo-ndk builds every target
# of this package, so the bin compiles on mobile too (stub main in desktop.rs).
# Desktop platform features come from gpui-kit's own target-gated
# gpui-pre-platform dependency (application(), font-kit, x11/wayland,
# runtime_shaders); nothing is enabled here beyond the workspace pins.
[[bin]]
name = "snackpilot-desktop"
path = "src/bin/desktop.rs"

[dependencies]
snackpilot-core = { workspace = true }
snackpilot-model = { path = "../model" }
gpui = { workspace = true }
gpui-kit = { workspace = true }
gpui-mobile = { workspace = true }
log = "0.4"

# Platform bridge over JNI (task 3.4): jni/ndk-context are genuinely used by
# src/ui/app/src/platform/android.rs; versions match what gpui-mobile 0b882ef already
# pins in the workspace lock, so no new crate versions enter the graph.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22"
ndk-context = "0.1"
