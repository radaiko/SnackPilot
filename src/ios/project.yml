name: SnackPilot
options:
  bundleIdPrefix: dev.radaiko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Aptabase:
    url: https://github.com/aptabase/aptabase-swift.git
    from: "0.3.4"
settings:
  base:
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "35"
    SWIFT_VERSION: "5.0"
targets:
  SnackPilot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnackPilot
    dependencies:
      - framework: Frameworks/SnackPilotCore.xcframework
        embed: false
      - package: Aptabase
    # Real Info.plist generated by xcodegen (gitignored). GENERATE_INFOPLIST_FILE only injects
    # its fixed INFOPLIST_KEY_* whitelist — UIBackgroundModes/BGTaskSchedulerPermittedIdentifiers
    # are silently dropped there (validated: the packaged app lacked both, so the BGTask never
    # ran). Everything the generated plist used to carry lives here, with correct types.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SnackPilot
        # Export compliance: the app uses only standard HTTPS/TLS (exempt encryption), so declare
        # NO to skip the export-compliance prompt on every TestFlight/App Store upload.
        ITSAppUsesNonExemptEncryption: false
        # Location purpose strings (notifications-location §10). "Always" is required for region
        # monitoring; the geofence is the only location use.
        NSLocationWhenInUseUsageDescription: "SnackPilot nutzt deinen Standort, um deinen Firmenstandort zu speichern."
        NSLocationAlwaysAndWhenInUseUsageDescription: "SnackPilot nutzt deinen Standort, um dich an Bestellungen zu erinnern, wenn du im Büro bist."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen: {}
        # Background execution (docs/architecture §4.4): one BGAppRefreshTask runs the new-menu
        # scrape + order-sync reminder checks while suspended. BGAppRefreshTask requires the
        # "fetch" mode (processing is only for BGProcessingTask); region monitoring itself still
        # needs no mode (notifications-location §10).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.radaiko.gourmetclient.menu-refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.radaiko.gourmetclient
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Per-accent alternate app icons (themes §6). The four alternates ship in the asset
        # catalog; AppModel.setAccent switches to them via UIApplication.setAlternateIconName.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-emerald AppIcon-berry AppIcon-golden AppIcon-ocean"
        # rustls-tls core links no Apple TLS, but reqwest/ring still need libc++.
        OTHER_LDFLAGS: "-lc++"
  SnackPilotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnackPilotTests
    dependencies:
      - target: SnackPilot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
