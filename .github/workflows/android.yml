name: android

# Builds the Rust core for Android and the debug app, then lints it.
# Release signing lives in android-publish.yml (tag-driven).

on:
  push:
    branches: [main]
    paths: ["src/core/**", "src/ui/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["src/core/**", "src/ui/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces the run in flight: this is the longest job (a full Rust
# NDK build plus Gradle), and a superseded run only wastes runner time.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  NDK_VERSION: 30.0.16248370

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install the Rust Android targets
        run: rustup target add x86_64-linux-android aarch64-linux-android

      - name: Cache cargo and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/core/target
            src/ui/target
          key: android-${{ hashFiles('src/core/Cargo.lock', 'src/ui/Cargo.lock', 'src/ui/android/gradle/**', 'src/ui/android/**/*.gradle.kts') }}

      - name: Install the Android NDK and cargo-ndk
        run: |
          set -euo pipefail
          ndk="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          if [ ! -d "$ndk" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null || true
          fi
          [ -d "$ndk" ] || { echo "NDK ${NDK_VERSION} is not installed under ${ANDROID_HOME}/ndk" >&2; exit 1; }
          echo "ANDROID_NDK_HOME=${ndk}" >> "$GITHUB_ENV"
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Build the Rust app for the Android targets
        run: tools/devops/ui-android-build.sh

      - name: Build the debug app
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: src/ui/android

      # Lint is a real gate: it reports 0 errors and 22 warnings, and a new
      # error fails the job. The report is uploaded either way.
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
        working-directory: src/ui/android

      - name: Upload APK and lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            src/ui/android/app/build/outputs/apk/debug/*.apk
            src/ui/android/app/build/reports/lint-results-debug.html
