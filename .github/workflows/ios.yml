name: ios

# Builds the simulator app and smoke-launches it on a fresh simulator. The
# signed .ipa for the App Store is still produced by `make ios-archive` on the
# Mac; GitHub-hosted runners only carry the simulator build.

on:
  push:
    branches: [main]
    paths: ["src/core/**", "src/ui/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["src/core/**", "src/ui/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DEVICE_NAME: CI iPhone

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust simulator target
        run: rustup target add aarch64-apple-ios-sim

      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/ui/target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('src/ui/Cargo.lock') }}

      - name: Build the core and generate the Xcode project
        run: ./bootstrap.sh
        working-directory: src/ui/ios

      - name: Build for the simulator
        run: |
          xcodebuild -scheme SnackPilot -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO build
        working-directory: src/ui/ios

      - name: Smoke test on a simulator
        working-directory: src/ui/ios
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p build/ci/smoke
          read -r runtime devtype < <(xcrun simctl list runtimes available -j | python3 -c "import json,sys; r=[r for r in json.load(sys.stdin)['runtimes'] if r['platform']=='iOS'][-1]; print(r['identifier'],[d['identifier'] for d in r['supportedDeviceTypes'] if d['productFamily']=='iPhone'][-1])")
          echo "== runtime=$runtime device=$devtype"
          udid=$(xcrun simctl create "$DEVICE_NAME $GITHUB_RUN_NUMBER" "$devtype" "$runtime")
          echo "== udid=$udid"
          trap 'xcrun simctl shutdown "$udid" || true; xcrun simctl delete "$udid" || true' EXIT
          echo "== boot"
          xcrun simctl boot "$udid"
          echo "== wait for boot (bounded)"
          # macOS has perl but no `timeout`; a wedged boot must fail here, not
          # hold the job until its 50-minute limit.
          perl -e 'alarm shift; exec @ARGV' 300 xcrun simctl bootstatus "$udid" -b
          echo "== install"
          app=$(find build/ci/Build/Products -name '*.app' -maxdepth 2 | head -1)
          echo "== app=$app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$udid" "$app"
          echo "== launch $bundle"
          xcrun simctl launch "$udid" "$bundle"
          for _ in $(seq 1 30); do
            xcrun simctl spawn "$udid" launchctl list | grep -q "$bundle" && break
            sleep 1
          done
          echo "== assert the process is alive"
          xcrun simctl spawn "$udid" launchctl list | grep -q "$bundle"
          xcrun simctl io "$udid" screenshot build/ci/smoke/launch.png
          xcrun simctl spawn "$udid" log show --last 2m --predicate "subsystem CONTAINS '$bundle'" > build/ci/smoke/app.log || true
          (cd "$(dirname "$app")" && zip -qry "$OLDPWD/build/ci/smoke/SnackPilot.app.zip" "$(basename "$app")")

      - name: Upload app, screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: src/ui/ios/build/ci/smoke/
