name: android-publish

# Builds the signed release bundle on an android/v* tag and puts it on the Play
# alpha track. `make ship` still builds the same artifacts locally; this is the
# unattended path for a tagged release, which is why the keystore and the Play
# service account live in repository secrets.

on:
  push:
    tags: ["android/v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, skip the Play upload"
        type: boolean
        default: false

permissions:
  contents: read

# One publish at a time: two uploads racing would fight over the same edit.
concurrency:
  group: android-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  NDK_VERSION: 30.0.16248370

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install the Rust Android targets
        run: rustup target add x86_64-linux-android aarch64-linux-android

      - name: Cache cargo and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/core/target
            src/ui/target
          key: android-publish-${{ hashFiles('src/core/Cargo.lock', 'src/ui/Cargo.lock', 'src/ui/android/gradle/**', 'src/ui/android/**/*.gradle.kts') }}

      - name: Install the Android NDK and cargo-ndk
        run: |
          set -euo pipefail
          ndk="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          if [ ! -d "$ndk" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null || true
          fi
          [ -d "$ndk" ] || { echo "NDK ${NDK_VERSION} is not installed under ${ANDROID_HOME}/ndk" >&2; exit 1; }
          echo "ANDROID_NDK_HOME=${ndk}" >> "$GITHUB_ENV"
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      # Gradle looks for keystore.properties in src/ui/android and resolves storeFile
      # against the app module, so the key belongs in src/ui/android/app.
      - name: Restore the upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "no keystore secret — refusing an unsigned release"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | openssl base64 -d -A > src/ui/android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > src/ui/android/keystore.properties
          chmod 600 src/ui/android/app/upload-keystore.jks src/ui/android/keystore.properties

      - name: Build the Rust core for the Android targets
        run: tools/devops/ui-android-build.sh --release

      - name: Build the release bundle
        run: ./gradlew :app:bundleRelease --no-daemon
        working-directory: src/ui/android

      - name: Show what is about to be published
        run: |
          AAB=src/ui/android/app/build/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          unzip -l "$AAB" | grep -c 'META-INF/.*\.RSA' >/dev/null \
            || { echo "bundle is not signed — refusing to upload"; exit 1; }

      - name: Upload to the Play alpha track
        if: ${{ !inputs.dry_run }}
        env:
          PLAY_SA_B64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          [ -n "$PLAY_SA_B64" ] || { echo "no Play service account secret"; exit 1; }
          SA="$(mktemp)"; trap 'rm -f "$SA"' EXIT
          printf '%s' "$PLAY_SA_B64" | openssl base64 -d -A > "$SA"
          chmod 600 "$SA"
          SNACKPILOT_PLAY_SA="$SA" tools/devops/play-upload.sh \
            src/ui/android/app/build/outputs/bundle/release/app-release.aab alpha

      - name: Keep the bundle and drop the key material
        if: always()
        run: |
          rm -f src/ui/android/app/upload-keystore.jks src/ui/android/keystore.properties

      - name: Upload the bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: src/ui/android/app/build/outputs/bundle/release/*.aab
