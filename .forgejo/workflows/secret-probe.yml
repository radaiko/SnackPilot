name: secret-probe

# Temporary: reports what the runner actually sees for the Android secrets.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: android
    steps:
      - name: Dump lengths and magic bytes
        env:
          KS: ${{ secrets.SNACKPILOT_ANDROID_KEYSTORE_B64 }}
          SA: ${{ secrets.SNACKPILOT_PLAY_SA_JSON }}
          SP: ${{ secrets.SNACKPILOT_ANDROID_STORE_PASSWORD }}
          KA: ${{ secrets.SNACKPILOT_ANDROID_KEY_ALIAS }}
        run: |
          echo "keystore_len=${#KS}"
          echo "play_len=${#SA}"
          echo "storepass_len=${#SP}"
          echo "alias_len=${#KA}"
          echo "keystore_head=$(printf '%s' "$KS" | head -c 6)"
          echo "play_head=$(printf '%s' "$SA" | head -c 6)"
          printf '%s' "$KS" | openssl base64 -d -A > /tmp/ks.bin 2>/dev/null || echo "base64 decode failed"
          echo "decoded_bytes=$(wc -c < /tmp/ks.bin | tr -d ' ')"
          echo "decoded_head=$(head -c 4 /tmp/ks.bin | xxd -p)"
          exit 1
