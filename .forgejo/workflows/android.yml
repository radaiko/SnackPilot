name: android

# Builds the Rust core for Android and the debug app, then lints it. Release signing stays local (make ship).

on:
  push:
    branches: [main]
    paths: ["src/core/**", "src/android/**", ".forgejo/workflows/android.yml"]
  pull_request:
    paths: ["src/core/**", "src/android/**", ".forgejo/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: android
    timeout-minutes: 50
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/core/target
          key: android-${{ hashFiles('src/core/Cargo.lock', 'src/android/gradle/**', 'src/android/**/*.gradle.kts') }}

      - name: Build the core and copy it into the app
        run: ./bootstrap.sh
        working-directory: src/android

      - name: Build and lint the debug app
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
        working-directory: src/android

      - name: Upload APK and lint report
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: android-debug
          path: |
            src/android/app/build/outputs/apk/debug/*.apk
            src/android/app/build/reports/lint-results-debug.html
