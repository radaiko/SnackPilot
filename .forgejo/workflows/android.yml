name: android

# Builds the Rust core for Android and the debug app, then lints it. Release signing stays local (make ship).

on:
  push:
    branches: [main]
    paths: ["src/core/**", "src/ui/**", ".forgejo/workflows/android.yml"]
  pull_request:
    paths: ["src/core/**", "src/ui/**", ".forgejo/workflows/android.yml"]
  workflow_dispatch:

# A newer push replaces the run in flight: this is the longest job (a full Rust
# NDK build plus Gradle), and a superseded run only wastes a runner slot.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: android
    timeout-minutes: 50
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/core/target
            src/ui/target
          key: android-${{ hashFiles('src/core/Cargo.lock', 'src/ui/Cargo.lock', 'src/ui/android/gradle/**', 'src/ui/android/**/*.gradle.kts') }}

      - name: Build the Rust app for the Android targets
        run: tools/devops/ui-android-build.sh

      - name: Build the debug app
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: src/ui/android

      # Lint is a real gate now: it reports 0 errors and 22 warnings, and a new
      # error fails the job.
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
        working-directory: src/ui/android

      # Only the lint report is kept. The debug APK is not a distributable and is
      # a few hundred MB per run, which the nightly forgejo dump cannot absorb, so
      # it is built for the check and thrown away. Retention stays at one day
      # because the report only matters until the next run.
      - name: Upload the lint report
        if: always() && github.ref == 'refs/heads/main'
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: android-lint
          path: src/ui/android/app/build/reports/lint-results-debug.html
          retention-days: 1
